name: KFP Backend Tests

on:
  push:
    branches:
      - master
      - main
      - stable
      - 'rhoai-*'
  pull_request:
    branches:
      - master
      - main
      - stable
      - 'rhoai-*'
    paths:
      - '.github/workflows/presubmit-backend.yml'
      - '.github/actions/setup-go/**'
      - '.github/resources/scripts/download-go-modules.sh'
      - '.github/resources/scripts/helper-functions.sh'
      - 'go.mod'
      - 'go.sum'
      # RH-added modules not present upstream; not covered by kubeflow's list.
      - 'api/go.mod'
      - 'api/go.sum'
      - 'kubernetes_platform/go.mod'
      - 'kubernetes_platform/go.sum'
      - 'backend/**'
      - 'test/presubmit-backend-test.sh'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: ./.github/actions/setup-go

    - name: Run Backend Tests
      env:
        GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        GIT_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        ./test/presubmit-backend-test.sh
