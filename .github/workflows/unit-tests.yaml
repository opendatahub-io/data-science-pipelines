name: Unit Tests
on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      # RH-added modules not present upstream.
      - api/go.mod
      - api/go.sum
      - kubernetes_platform/go.mod
      - kubernetes_platform/go.sum
      - backend/**
    types:
      - opened
      - reopened
      - closed
      - synchronize
  workflow_dispatch:
env:
  RESOURCES_DIR: ${{ github.workspace }}/.github/resources
jobs:
  functest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Run Unit Test
        working-directory: ${{ github.workspace }}/backend/src
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.RESOURCES_DIR }}/unittests/application_default_credentials.json
        run: go test ./...
